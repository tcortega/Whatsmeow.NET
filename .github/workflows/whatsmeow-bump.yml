name: whatsmeow-bump

# The weekly whatsmeow bump (#48, ADR 0043). build/bump.sh pins whatsmeow's latest main and opens the one bump PR, or
# adds a commit to it; it never builds, tests, merges or publishes. The PR's ci run does the checks once someone with
# write access approves it: a pull_request event from GITHUB_TOKEN creates its runs awaiting approval (GitHub docs,
# "When GITHUB_TOKEN triggers workflow runs"). Opening the PR needs the repository setting "Allow GitHub Actions to
# create and approve pull requests".

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsmeow-bump
  cancel-in-progress: false

env:
  MISE_VERSION: 2026.10.25

jobs:
  bump:
    name: bump
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The bump branch is fetched and extended, never rewritten, and pushed with this token.
          fetch-depth: 0

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: build/bump.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/bump.sh
