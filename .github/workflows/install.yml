name: install

# The consumers of a release's packages on every target host (ADR 0023, 0056, 0058): install runs build/ci.sh install on
# each native runner, both Alpine architectures inside the Linux ones, and aot publishes AotSmoke with Native AOT for
# every target RID. packaging.yml calls it with no tag, for the feed its package job built (the native-packages
# artifact); release.yml calls it with the tag once the publish job pushed it, and nuget-install.yml on demand with an
# already published tag, for the packages nuget.org serves (#52, ADR 0059). The scripts are the caller's revision; the
# release's inputs come from its tag. Every check lives in build/ci.sh.

on:
  workflow_call:
    inputs:
      tag:
        description: A published release's v<semver> tag, to install from nuget.org; empty installs the native-packages artifact.
        type: string
        default: ""
      cache:
        description: Restore and save the Go and mise caches.
        type: boolean
        default: true

permissions:
  contents: read

env:
  MISE_VERSION: 2026.10.25

jobs:
  install:
    name: install (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04 }
          - { name: linux-arm64, os: ubuntu-26.04-arm }
          - { name: osx-x64, os: macos-26-intel }
          - { name: osx-arm64, os: macos-26 }
          - { name: win-x64, os: windows-2025 }
          - { name: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The nuget.org install reads the release's inputs from its tag, which must be on this revision's line.
          fetch-depth: ${{ inputs.tag == '' && 1 || 0 }}
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Go reads the packaged binaries' build information (go version -m) and the release targets.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go
          cache_key_prefix: mise-install
          cache: ${{ inputs.cache }}

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-install-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum') }}
          restore-keys: go-install-${{ runner.os }}-

      - if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: ${{ runner.temp }}/native-packages

      - name: build/ci.sh install
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then source="nuget.org:${TAG#v}"; else source="$RUNNER_TEMP/native-packages"; fi
          bash build/ci.sh install "$source"

  # AotSmoke with Native AOT on every target RID, each on a native runner of its own (ADR 0056): Native AOT never crosses
  # operating systems, and an emulated run proves nothing about the RID. musl runs in the Alpine SDK container of its
  # architecture on the Linux runner of that architecture.
  aot:
    name: aot (${{ matrix.rid }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-26.04 }
          - { rid: linux-musl-arm64, os: ubuntu-26.04-arm }
          - { rid: osx-x64, os: macos-26-intel }
          - { rid: osx-arm64, os: macos-26 }
          - { rid: win-x64, os: windows-2025 }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.tag == '' && 1 || 0 }}
          persist-credentials: false

      # musl publishes with the Alpine container's SDK, not the runner's.
      - if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Only Go, which build/ci.sh checks against go.mod before any job; its own cache key, holding Go only.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go
          cache: ${{ inputs.cache }}
          cache_key_prefix: mise-aot

      - if: inputs.tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: ${{ runner.temp }}/native-packages

      - name: build/ci.sh aot
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then source="nuget.org:${TAG#v}"; else source="$RUNNER_TEMP/native-packages"; fi
          bash build/ci.sh aot "$source" "$RID"
