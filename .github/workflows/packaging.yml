name: packaging

# The native package (ADR 0023, 0069) and the rest of the feed: the package job on Windows builds every binary and packs every package; install.yml installs
# that same feed on every native host, including both Alpine architectures, and publishes AotSmoke from it with Native
# AOT on every target RID (ADR 0056, 0058). ci.yml calls it on main and on workflow_dispatch, and release.yml on every
# release and rehearsal (ADR 0050), so a release publishes the feed these checks passed. Every check lives in build/ci.sh.

on:
  workflow_call:
    inputs:
      rehearsal-tag:
        description: A tag the package job makes in its runner only, never pushed, so a rehearsal builds at its tag's version, 0.0.0-rehearsal.<run> or a candidate version.
        type: string
        default: ""
      cache:
        description: Restore and save the Go, NuGet and mise caches. A release builds without them (ADR 0050).
        type: boolean
        default: true

permissions:
  contents: read

env:
  MISE_VERSION: 2026.10.25

jobs:
  package:
    name: package (win-x64)
    timeout-minutes: 30
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer reads the version from the tags, and counts the height only over the history a clone has (ADR 0023).
          fetch-depth: 0
          persist-credentials: false

      - name: the rehearsal's tag, in this runner only
        if: inputs.rehearsal-tag != ''
        env:
          TAG: ${{ inputs.rehearsal-tag }}
        run: git tag "$TAG"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: ${{ inputs.cache }}

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-package-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum', 'sidecar/go.sum') }}
          restore-keys: go-package-${{ runner.os }}-

      - if: inputs.cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'dotnet/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: build/ci.sh package
        run: bash build/ci.sh package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages
          path: dotnet/artifacts/package/
          if-no-files-found: error
          # A release's publish job reads it, possibly after days of waiting for approval, and so does its re-run.
          retention-days: 30

  # The feed's consumers on every target host and Native AOT on every target RID, in install.yml, which release.yml
  # also calls after a publish to install the same release from nuget.org.
  consumers:
    name: consumers
    needs: package
    uses: ./.github/workflows/install.yml
    with:
      cache: ${{ inputs.cache }}
