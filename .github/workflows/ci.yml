name: ci

# Every check lives in build/ci.sh, one subcommand per job, so a local `bash build/ci.sh all` runs exactly this.
# The workflow only installs tools, restores caches and calls it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MISE_VERSION: 2026.10.25

jobs:
  contract:
    name: contract (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only until the code is complete; osx-arm64 and win-x64 come back for the platform pass (issue log #11).
          - { name: linux-x64, os: ubuntu-26.04 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # buf breaking reads the merge-base with main, and the gate reads the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-contract-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum', 'sidecar/go.sum', 'third_party/whatsmeow/VERSION') }}
          restore-keys: go-contract-${{ runner.os }}-

      - name: build/ci.sh contract
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BEFORE: ${{ github.event.before }}
        run: bash build/ci.sh contract

  go:
    name: go (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only until the code is complete; osx-arm64 and win-x64 come back for the platform pass (issue log #11).
          - { name: linux-x64, os: ubuntu-26.04 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Go and lint caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
            echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-go-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum', 'sidecar/go.sum') }}
          restore-keys: go-go-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('mise.toml', '.golangci.yml', 'tools/go.sum', 'sidecar/go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-

      - name: build/ci.sh go
        run: bash build/ci.sh go

  dotnet:
    name: dotnet (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux only until the code is complete; osx-arm64 and win-x64 come back for the platform pass (issue log #11).
          - { name: linux-x64, os: ubuntu-26.04 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Go runs the repository guard (tools/check-repo), and the integration tests build whatsmeow-net with it.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-dotnet-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum', 'sidecar/go.sum') }}
          restore-keys: go-dotnet-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'dotnet/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: build/ci.sh dotnet
        run: bash build/ci.sh dotnet

  # Native packages (ADR 0023): Windows builds every binary and packs every package, then installs them there; the
  # install jobs install that same feed on Linux and macOS, so packages built on Windows must run there.
  package:
    name: package (win-x64)
    # Manual only until the platform pass: the native packages build on Windows (ADR 0023).
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-package-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum', 'sidecar/go.sum') }}
          restore-keys: go-package-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'nuget.config', 'dotnet/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: build/ci.sh package
        run: bash build/ci.sh package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages
          path: dotnet/artifacts/package/
          if-no-files-found: error
          retention-days: 7

  install:
    name: install (${{ matrix.name }})
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-26.04 }
          - { name: osx-arm64, os: macos-26 }
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Go reads the packaged binaries' build information (go version -m) and the release targets.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: ${{ env.MISE_VERSION }}
          cache: true

      - name: Go caches under the runner temp directory
        run: |
          {
            echo "GOMODCACHE=$RUNNER_TEMP/go/mod"
            echo "GOCACHE=$RUNNER_TEMP/go/build"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go
          key: go-install-${{ runner.os }}-${{ hashFiles('mise.toml', 'tools/go.sum') }}
          restore-keys: go-install-${{ runner.os }}-

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: ${{ runner.temp }}/native-packages

      - name: build/ci.sh install
        run: bash build/ci.sh install "$RUNNER_TEMP/native-packages"

  ci:
    name: ci
    if: always()
    needs: [contract, go, dotnet, package, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            # package and install are skipped outside workflow_dispatch until the platform pass.
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              exit 1
            fi
          done
