# golangci-lint v2. Version pinned in /mise.toml. Rules: docs/guidelines/go.md.
version: "2"

run:
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gosec
    - importas
    - noctx
    - nolintlint
    - revive
    - wrapcheck
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: reflect
              desc: no runtime reflection (docs/guidelines/go.md)
            - pkg: unsafe
              desc: no unsafe and no cgo; cgo imports unsafe (docs/guidelines/go.md)
        error-mapping:
          files:
            - $all
            - "!**/internal/server/**"
            # A test reads the status a call returned, to check its reason; it never builds one.
            - "!$test"
          deny:
            - pkg: google.golang.org/grpc/status
              desc: errors become gRPC statuses in internal/server only; return %w errors (docs/guidelines/go.md)
            - pkg: google.golang.org/genproto/googleapis/rpc/errdetails
              desc: ErrorInfo is built in internal/server only (docs/guidelines/go.md)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^encoding\.RegisterCodec(V2)?$
          pkg: ^google\.golang\.org/grpc/encoding$
          msg: package-level mutable state; install the lenient codec with grpc.ForceServerCodecV2 (docs/guidelines/go.md)
        - pattern: ^sql\.DB\.(Exec|ExecContext|Begin|BeginTx)$
          pkg: ^database/sql$
          msg: the sidecar writes through store.Writer, the fair write gate (ADR 0040)
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/tcortega/Whatsmeow.NET/sidecar/gen/whatsmeow/v1
          alias: whatsmeowv1
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    rules:
      # The gate itself, the migration that runs before the store is handed out, and tests' own setup writes.
      - path: (^|/)internal/store/|_test\.go$
        linters: [forbidigo]
        text: store\.Writer

issues:
  # Report every finding, never a sample of them.
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tcortega/Whatsmeow.NET
