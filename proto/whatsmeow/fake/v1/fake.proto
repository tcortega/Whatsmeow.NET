syntax = "proto3";

package whatsmeow.fake.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "waE2E/WAWebProtobufsE2E.proto";

// FakeWhatsAppService scripts the fake WhatsApp of a test build of whatsmeow-net (-tags fakewhatsapp) started with
// --fake-whatsapp, and records what the sidecar sent to it. It is served next to whatsmeow.v1 on the same socket,
// with the same token. It is not part of the whatsmeow.v1 contract and never ships (ADR 0019).
//
// Each slice adds the controls it needs here. Errors are INTERNAL with a message: the fake adds no ErrorReason.
service FakeWhatsAppService {
  // DeliverMessage makes WhatsApp deliver a decrypted message to a session's client, and returns once the client's
  // event handlers ran. As whatsmeow does at the pin, the client answers with a receipt only when every handler
  // succeeded (message.go:459-462, 489-495); that shows in WaitForSent. A session without a client is an error: the
  // fake never answers on behalf of a client the sidecar did not create.
  rpc DeliverMessage(DeliverMessageRequest) returns (DeliverMessageResponse);

  // DeliverUndecryptableMessage makes WhatsApp deliver a message the session's client cannot decrypt, and returns once
  // the client's event handlers ran. whatsmeow sends its retry receipt and ack before it dispatches
  // UndecryptableMessage, whatever the handlers return (message.go:418-437); the fake records neither. A resend that
  // decrypts is a DeliverMessage with the same id. A session without a client is an error.
  rpc DeliverUndecryptableMessage(DeliverUndecryptableMessageRequest) returns (DeliverUndecryptableMessageResponse);

  // WaitForSent returns the first thing the session's client sent to WhatsApp after the entry `after`, and waits
  // until there is one. Only the call's deadline or cancellation ends the wait. The log lives in the sidecar process,
  // so it starts again, at index 1, after a restart.
  rpc WaitForSent(WaitForSentRequest) returns (WaitForSentResponse);

  // LinkDevice makes the phone link the session's device: the client stores the device under jid as whatsmeow does
  // after a pair success (handlePair, pair.go:222-240), then dispatches PairSuccess and returns once its event handlers
  // ran. Without a Pair call open it is the quick way to a paired session. With one, the client's QR channel then sends
  // success and closes, as whatsmeow's does (qrchan.go:189-190), and the client logs in again after WhatsApp's 515
  // (connectionevents.go:26-38): off the node queue it uploads its pre-keys, unless FailNextPreKeyUpload, and
  // dispatches Connected (connectionevents.go:187-204).
  rpc LinkDevice(LinkDeviceRequest) returns (LinkDeviceResponse);

  // RotateQrCode makes the session's open QR channel send the next code, as whatsmeow's does when the previous one
  // expires (qrchan.go:92-110). The first code comes when the client connects. No QR channel open is an error.
  rpc RotateQrCode(RotateQrCodeRequest) returns (RotateQrCodeResponse);

  // ExpireQrCodes makes the session's QR codes run out: the QR channel sends timeout and closes, and the client
  // disconnects without a Disconnected event, as whatsmeow's does (qrchan.go:77-84). No QR channel open is an error.
  rpc ExpireQrCodes(ExpireQrCodesRequest) returns (ExpireQrCodesResponse);

  // DropConnection makes the connection of a session that is pairing drop: the client dispatches Disconnected off the
  // node queue (client.go:612-622), and its QR channel then sends timeout and closes (qrchan.go:196-197). whatsmeow
  // does not reconnect an unpaired client (client.go:648). No QR channel open is an error. It returns before the
  // handlers run.
  rpc DropConnection(DropConnectionRequest) returns (DropConnectionResponse);

  // FailNextPreKeyUpload makes the session's next login after a link fail to upload the pre-keys: whatsmeow only logs
  // that (prekeys.go:84-87), never sets PreKeysUploaded, and still dispatches Connected (connectionevents.go:187-204).
  rpc FailNextPreKeyUpload(FailNextPreKeyUploadRequest) returns (FailNextPreKeyUploadResponse);

  // FailNextPairPhone makes WhatsApp answer the session's next phone pairing request with an IQ error of code
  // (pair-code.go:104-127): 429 is whatsmeow's ErrIQRateOverLimit (errors.go:197).
  rpc FailNextPairPhone(FailNextPairPhoneRequest) returns (FailNextPairPhoneResponse);

  // FailNextConnect makes the session's next connect fail with an error whatsmeow does not retry. Without it a
  // connect succeeds, and a linked client then gets Connected, as whatsmeow does once WhatsApp accepts the login.
  rpc FailNextConnect(FailNextConnectRequest) returns (FailNextConnectResponse);

  // FailNextLogout makes the session's next logout get no answer from WhatsApp: whatsmeow's unlink request times out
  // (ErrIQTimedOut, request.go:180-181), and the client stays connected with its device, as whatsmeow's does.
  rpc FailNextLogout(FailNextLogoutRequest) returns (FailNextLogoutResponse);

  // RaisePermanentDisconnect makes WhatsApp end the session's connection with one of the six whatsmeow
  // PermanentDisconnect events at the pin (types/events/events.go:118-128), dispatched off the node queue as
  // whatsmeow does; the client is disconnected and does not reconnect. For logged_out the client also deletes its
  // device concurrently, as whatsmeow does (connectionevents.go:37-44, 130-136). It returns before the handlers run.
  rpc RaisePermanentDisconnect(RaisePermanentDisconnectRequest) returns (RaisePermanentDisconnectResponse);

  // RegisterUser adds a user to WhatsApp's directory, which every session's lookups read: IsOnWhatsApp, GetUserInfo,
  // and the LID that UpdateBlocklist and a send to a phone number fetch (send.go:341-365). An unregistered number is
  // not on WhatsApp. Registering a phone_jid again replaces it.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);

  // SetProfilePicture sets what WhatsApp answers for the profile picture of a user or a group; without one it answers
  // that there is none.
  rpc SetProfilePicture(SetProfilePictureRequest) returns (SetProfilePictureResponse);

  // DeliverContactNotification makes WhatsApp send the session's client a picture or status notification. As
  // whatsmeow does, the client dispatches Picture or UserAbout on the node queue and ignores the handlers' result
  // (notification.go:91-115, 449-466, 472); it returns once the handlers ran. A session without a client is an error.
  rpc DeliverContactNotification(DeliverContactNotificationRequest) returns (DeliverContactNotificationResponse);

  // SyncContact makes an app state sync deliver a contact's saved name: the client stores it, then dispatches Contact,
  // as whatsmeow does (appstate.go:292-296). The session must be linked.
  rpc SyncContact(SyncContactRequest) returns (SyncContactResponse);

  // FailNextContactQuery makes WhatsApp answer the session's next contact query (IsOnWhatsApp, GetUserInfo,
  // GetProfilePictureInfo, GetBlocklist, UpdateBlocklist) with an IQ error of code: 429 is whatsmeow's
  // ErrIQRateOverLimit (errors.go:197).
  rpc FailNextContactQuery(FailNextContactQueryRequest) returns (FailNextContactQueryResponse);
  // DeliverPresence makes WhatsApp send a user's presence to the session's client, which dispatches events.Presence on
  // its node queue (presence.go:39-58), and returns once the client's event handlers ran. whatsmeow answers nothing.
  // A session without a client is an error.
  rpc DeliverPresence(DeliverPresenceRequest) returns (DeliverPresenceResponse);

  // DeliverChatPresence makes WhatsApp send a user's chat state to the session's client, which dispatches
  // events.ChatPresence on its node queue (presence.go:18-37), and returns once the client's event handlers ran.
  // whatsmeow answers nothing. A session without a client is an error.
  rpc DeliverChatPresence(DeliverChatPresenceRequest) returns (DeliverChatPresenceResponse);

  // SetPushName makes the app state sync set the account's push name, as whatsmeow does for the push name setting: it
  // sets the device's push name and saves the device (appstate.go:364-374). Until then SendPresence fails with
  // whatsmeow's ErrNoPushName (presence.go:67-68). A session without a client is an error.
  rpc SetPushName(SetPushNameRequest) returns (SetPushNameResponse);

  // FailNextUploads makes the session's next count uploads fail after they encrypted the file, as a POST that fails
  // does (upload.go:291-302). Each attempt shows in WaitForSent as a MediaUpload.
  rpc FailNextUploads(FailNextUploadsRequest) returns (FailNextUploadsResponse);

  // ExpireMedia makes WhatsApp answer every download of direct_path with status, as whatsmeow reports it
  // (ErrMediaDownloadFailedWith403, 404 or 410, errors.go:133-135).
  rpc ExpireMedia(ExpireMediaRequest) returns (ExpireMediaResponse);

  // CorruptMedia flips one byte of the ciphertext stored at direct_path, so every download of it fails verification
  // (ErrInvalidMediaEncSHA256, download-to-file.go:218-219) and leaves ciphertext in the file, as whatsmeow does.
  rpc CorruptMedia(CorruptMediaRequest) returns (CorruptMediaResponse);

  // HoldNextDownload makes the session's next download write part of the file and then wait until its call ends.
  rpc HoldNextDownload(HoldNextDownloadRequest) returns (HoldNextDownloadResponse);

  // AnswerMediaRetry makes the phone answer the session's media retry request for message_id, which WaitForSent
  // showed as a MediaRetryReceipt: it encrypts the answer with the media key the request carried, as the phone does,
  // and returns once the client's event handlers ran. With reupload, the phone uploads the media at
  // from_direct_path again, to a new path. whatsmeow acknowledges the notification whatever the handlers return
  // (notification.go:510-511), so nothing shows in WaitForSent. No request for message_id is an error.
  rpc AnswerMediaRetry(AnswerMediaRetryRequest) returns (AnswerMediaRetryResponse);

  // DeliverReceipt makes WhatsApp deliver a receipt to a session's client, and returns once the client's event
  // handlers ran. With SynchronousAck, whatsmeow acks a receipt only when every handler succeeded
  // (maybeDeferredAck, receipt.go:21-43, 115-128); a retry receipt it acks inside its retry handler, before the
  // dispatch, whatever the handlers return (receipt.go:34-38, retry.go:184-192). The ack shows in WaitForSent. A
  // session without a client is an error.
  rpc DeliverReceipt(DeliverReceiptRequest) returns (DeliverReceiptResponse);

  // RateLimitNextSends makes the session's next count sends fail as WhatsApp's rate limit fails them: an IQ before the
  // node is written answers 429 (ErrIQRateOverLimit, errors.go:197), so nothing is sent.
  rpc RateLimitNextSends(RateLimitNextSendsRequest) returns (RateLimitNextSendsResponse);

  // HoldNextSend makes the session's next send write its node, which WaitForSent shows, and then get no answer until
  // ReleaseSend: like whatsmeow's, it then returns ctx.Err() when its context ends (send.go:445-455), and when the
  // connection ends, a DisconnectedError 5 s later, once whatsmeow's wait for a reconnect is over (request.go:185-202),
  // since the fake never reconnects on its own. ReleaseSend makes WhatsApp accept it.
  rpc HoldNextSend(HoldNextSendRequest) returns (HoldNextSendResponse);

  // ReleaseSend makes WhatsApp answer the session's held send: it succeeds. No held send is an error.
  rpc ReleaseSend(ReleaseSendRequest) returns (ReleaseSendResponse);

  // AddGroup puts a group on WhatsApp's side, which every session's group calls read and change. Its members are
  // phone-number JIDs; in a LID-addressed group WhatsApp answers each by the LID RegisterUser gave it, with the phone
  // number beside it, and by the phone number when it has none. Adding a jid again replaces the group.
  rpc AddGroup(AddGroupRequest) returns (AddGroupResponse);

  // DeliverGroupNotification makes WhatsApp send the session's client a w:gp2 notification of a change to a group,
  // which need not be on WhatsApp's side. The client dispatches GroupInfo on its node queue, and returns once the
  // handlers ran; as whatsmeow does, it acks the notification only when every handler succeeded
  // (notification.go:493-506, maybeDeferredAck receipt.go:115-128), and the ack, of class "notification", the
  // request's id and type "w:gp2", shows in WaitForSent. The group calls' notifications are acked the same way. A
  // session without a client is an error.
  //
  // The group calls themselves notify the members as WhatsApp would, the member who made the change included
  // [inferred: whatsmeow's own note that the server echoes a change, send.go:665]: a member added, or one that joins by
  // link, gets a create notification (JoinedGroup), and every other member a change. WhatsApp's codes are [inferred]:
  // a non-admin's change to a locked group's info, to its settings or to its participants is 403, and to its invite
  // link 401 (whatsmeow's ErrGroupInviteLinkUnauthorized, group.go:432); a group the session is not in is 403 and an
  // unknown one 404 (group.go:674-678); adding a member is 409, and removing, promoting or demoting a non-member 404,
  // for that participant; a reset invite code is 410 and an unknown one 406 (group.go:516-519); the creator gets no
  // JoinedGroup for its own group; the create answer lists a participant WhatsApp refused, with its error. WhatsApp's
  // time on these calls is fixed, 2026-11-01T12:00:00Z, so a test knows each time they answer and notify; an invite
  // RefuseGroupAdd offers expires 72 hours after it.
  rpc DeliverGroupNotification(DeliverGroupNotificationRequest) returns (DeliverGroupNotificationResponse);

  // RefuseGroupAdd makes WhatsApp refuse to add a user to any group, by CreateGroup or by adding them, with code; with
  // invite, WhatsApp offers an invite instead, as for a user whose privacy settings ask for one (group.go:729-739).
  rpc RefuseGroupAdd(RefuseGroupAddRequest) returns (RefuseGroupAddResponse);

  // FailNextGroupQuery makes WhatsApp answer the session's next group call with an IQ error of code: 429 is
  // whatsmeow's ErrIQRateOverLimit (errors.go:197).
  rpc FailNextGroupQuery(FailNextGroupQueryRequest) returns (FailNextGroupQueryResponse);
  // SyncChatState makes the phone change a chat's state, and the session's client sync it as whatsmeow does after a
  // server_sync notification: on its node queue, holding its app state lock while it fetches (appstate.go:46-47,
  // notification.go:481-483), and dispatching the change once it let go of the lock (appstate.go:36-38). While the
  // collection is corrupted (CorruptAppState) the fetch fails instead: whatsmeow dispatches AppStateSyncError holding
  // the lock (appstate.go:167), and the change does not arrive. With full_sync the change arrives as a full sync's,
  // marked FromFullSync, as it does after pairing. It returns once the client's event handlers ran. A session without
  // a client is an error.
  rpc SyncChatState(SyncChatStateRequest) returns (SyncChatStateResponse);

  // GetPhoneChatState reads what the phone shows for a chat: what the session's writes (SendAppState) and SyncChatState
  // made it.
  rpc GetPhoneChatState(GetPhoneChatStateRequest) returns (GetPhoneChatStateResponse);

  // CorruptAppState makes the session's copy of an app state collection out of step with WhatsApp's, as a mismatching
  // LTHash does [inferred: the server cannot verify the hash, so it shows only when another device's patch arrives]:
  // a write to it is rejected with a 409 whose patches do not verify (appstate.go:607-614), and a sync of it fails.
  // A full sync (FetchAppState with fullSync) repairs it, unless unrecoverable: then the full sync fails too, as one
  // whose snapshot does not verify does (appstate/decode.go:287-294).
  rpc CorruptAppState(CorruptAppStateRequest) returns (CorruptAppStateResponse);

  // HoldFullSync makes the session's next full syncs wait, holding the client's app state lock, until it is called
  // again with hold false. A full sync is recorded (Sent.app_state_full_sync) before it waits.
  rpc HoldFullSync(HoldFullSyncRequest) returns (HoldFullSyncResponse);
}

// FailNextUploadsRequest names the session and how many uploads fail.
message FailNextUploadsRequest {
  // The session whose next uploads fail.
  string session_id = 1;
  // How many.
  uint32 count = 2;
}

// FailNextUploadsResponse has no fields.
message FailNextUploadsResponse {}

// ExpireMediaRequest names the media and WhatsApp's answer.
message ExpireMediaRequest {
  // The media's direct path.
  string direct_path = 1;
  // 403, 404 or 410.
  int32 status = 2;
}

// ExpireMediaResponse has no fields.
message ExpireMediaResponse {}

// CorruptMediaRequest names the media.
message CorruptMediaRequest {
  // The media's direct path.
  string direct_path = 1;
}

// CorruptMediaResponse has no fields.
message CorruptMediaResponse {}

// HoldNextDownloadRequest names the session.
message HoldNextDownloadRequest {
  // The session whose next download is held.
  string session_id = 1;
}

// HoldNextDownloadResponse has no fields.
message HoldNextDownloadResponse {}

// AnswerMediaRetryRequest is the phone's answer.
message AnswerMediaRetryRequest {
  // The session whose request is answered.
  string session_id = 1;
  // The message id the request named.
  string message_id = 2;

  // The answer.
  oneof answer {
    // The direct path of the media to upload again: the answer is SUCCESS with a new path.
    string reupload_from = 3;
    // An encrypted answer without media: 0 GENERAL_ERROR, 2 NOT_FOUND or 3 DECRYPTION_ERROR (WAMmsRetry ResultType).
    int32 result = 4;
    // An unencrypted error code, as the phone sends one when it has nothing (2: not on the phone).
    int32 error_code = 5;
  }

  // When the phone answered; unset is the zero time.
  google.protobuf.Timestamp answer_time = 6;
}

// AnswerMediaRetryResponse has no fields.
message AnswerMediaRetryResponse {}

// LinkDeviceRequest names the session and the device's JID.
message LinkDeviceRequest {
  // The session whose client is linked.
  string session_id = 1;
  // The device JID WhatsApp assigns, user:device@s.whatsapp.net.
  string jid = 2;
  // True to keep the app state key from the device. Otherwise the phone shares one as the device is linked, as it
  // does once after pairing (message.go:827-861), and the device can write app state.
  bool without_app_state_key = 3;
}

// LinkDeviceResponse has no fields.
message LinkDeviceResponse {}

// RotateQrCodeRequest names the session.
message RotateQrCodeRequest {
  // The session whose QR channel sends the next code.
  string session_id = 1;
}

// RotateQrCodeResponse has no fields.
message RotateQrCodeResponse {}

// ExpireQrCodesRequest names the session.
message ExpireQrCodesRequest {
  // The session whose QR codes run out.
  string session_id = 1;
}

// ExpireQrCodesResponse has no fields.
message ExpireQrCodesResponse {}

// DropConnectionRequest names the session.
message DropConnectionRequest {
  // The session whose connection drops.
  string session_id = 1;
}

// DropConnectionResponse has no fields.
message DropConnectionResponse {}

// FailNextPreKeyUploadRequest names the session.
message FailNextPreKeyUploadRequest {
  // The session whose next pre-key upload fails.
  string session_id = 1;
}

// FailNextPreKeyUploadResponse has no fields.
message FailNextPreKeyUploadResponse {}

// FailNextPairPhoneRequest names the session and the error.
message FailNextPairPhoneRequest {
  // The session whose next phone pairing request fails.
  string session_id = 1;
  // WhatsApp's IQ error code.
  int32 code = 2;
}

// FailNextPairPhoneResponse has no fields.
message FailNextPairPhoneResponse {}

// FailNextConnectRequest names the session.
message FailNextConnectRequest {
  // The session whose next connect fails.
  string session_id = 1;
}

// FailNextConnectResponse has no fields.
message FailNextConnectResponse {}

// FailNextLogoutRequest names the session.
message FailNextLogoutRequest {
  // The session whose next logout gets no answer.
  string session_id = 1;
}

// FailNextLogoutResponse has no fields.
message FailNextLogoutResponse {}

// RaisePermanentDisconnectRequest is one PermanentDisconnect event.
message RaisePermanentDisconnectRequest {
  // events.LoggedOut.
  message LoggedOut {
    // The connect failure reason: 401, 403 or 406.
    int32 reason = 1;
  }

  // events.StreamReplaced.
  message StreamReplaced {}

  // events.ClientOutdated.
  message ClientOutdated {}

  // events.CATRefreshError.
  message CatRefreshError {
    // The refresh error's text.
    string message = 1;
  }

  // events.TemporaryBan.
  message TemporaryBan {
    // The ban code.
    int32 code = 1;
    // The time left, whole seconds; zero when WhatsApp sent none.
    google.protobuf.Duration expire = 2;
  }

  // events.ConnectFailure.
  message ConnectFailure {
    // The failure reason.
    int32 reason = 1;
    // The failure message.
    string message = 2;
  }

  // The session whose connection ends.
  string session_id = 1;
  // The event.
  oneof kind {
    // See LoggedOut.
    LoggedOut logged_out = 2;
    // See StreamReplaced.
    StreamReplaced stream_replaced = 3;
    // See ClientOutdated.
    ClientOutdated client_outdated = 4;
    // See CatRefreshError.
    CatRefreshError cat_refresh_error = 5;
    // See TemporaryBan.
    TemporaryBan temporary_ban = 6;
    // See ConnectFailure.
    ConnectFailure connect_failure = 7;
  }
}

// RaisePermanentDisconnectResponse has no fields.
message RaisePermanentDisconnectResponse {}

// DeliverMessageRequest is one inbound message. A JID is whatsmeow's string form; empty is none.
message DeliverMessageRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The WhatsApp message id.
  string id = 2;
  // The chat.
  string chat = 3;
  // The sender.
  string sender = 4;
  // The text, as a conversation message; empty sends an empty message.
  string text = 5;
  // The sender's other address form.
  string sender_alt = 6;
  // In a direct chat, the recipient's other address form.
  string recipient_alt = 7;
  // True when another of the account's devices sent it.
  bool is_from_me = 8;
  // The sender's push name.
  string push_name = 9;
  // The message's WhatsApp timestamp; unset is the zero time.
  google.protobuf.Timestamp message_time = 10;
  // True for a group message as whatsmeow sends one with a new sender key (send.go:795-831): the stanza's pkmsg part
  // decrypts to only the sender key, and its skmsg part to the content. The client dispatches a Message for each, with
  // the same info, in that order (message.go:355-497, 1172-1178), and answers once, after both.
  bool sender_key = 11;
  // The message as WhatsApp sends it, wrappers included, instead of text: the client dispatches it unwrapped by
  // whatsmeow's own events.Message.UnwrapRaw, as whatsmeow does (message.go:1172-1178). Unset sends text.
  WAWebProtobufsE2E.Message message = 12;
}

// DeliverUndecryptableMessageRequest is one inbound message that fails to decrypt.
message DeliverUndecryptableMessageRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The WhatsApp message id.
  string id = 2;
  // The chat.
  string chat = 3;
  // The sender.
  string sender = 4;
  // True when the sender asked not to show a placeholder (decrypt-fail="hide").
  bool hide_placeholder = 5;
  // The message's WhatsApp timestamp; unset is the zero time.
  google.protobuf.Timestamp message_time = 6;
  // True for a stanza with no ciphertext for this device, as WhatsApp sends a view-once message to a companion
  // (message.go:324-333).
  bool unavailable = 7;
  // The unavailable stanza's type attribute, whatsmeow's UnavailableType: "view_once", or empty for none.
  string unavailable_type = 8;
}

// DeliverUndecryptableMessageResponse has no fields.
message DeliverUndecryptableMessageResponse {}

// DeliverMessageResponse has no fields.
message DeliverMessageResponse {}

// WaitForSentRequest selects the next entry of one session.
message WaitForSentRequest {
  // The session whose entries count.
  string session_id = 1;
  // The index of the last entry already seen; 0 for the first.
  uint64 after = 2;
}

// WaitForSentResponse is the entry.
message WaitForSentResponse {
  // The entry.
  Sent sent = 1;
}

// Sent is one thing a client sent to WhatsApp.
message Sent {
  // Its position in the log, from 1, across all sessions.
  uint64 index = 1;
  // The session whose client sent it.
  string session_id = 2;
  // What was sent.
  oneof kind {
    // The receipt for a message WhatsApp delivered.
    Receipt receipt = 3;
    // The client closed its connection.
    Disconnect disconnect = 4;
    // The client asked WhatsApp to unlink its device (Logout).
    RemoveCompanionDevice remove_companion_device = 5;
    // The client set its presence (SendPresence).
    Presence presence = 6;
    // The client subscribed to a user's presence (SubscribePresence).
    SubscribePresence subscribe_presence = 7;
    // The client set its state in a chat (SendChatPresence).
    ChatPresence chat_presence = 8;
    // The client uploaded media, or tried to.
    MediaUpload media_upload = 9;
    // The client started downloading media.
    MediaDownload media_download = 10;
    // The client asked the phone to upload a message's media again.
    MediaRetryReceipt media_retry_receipt = 11;
    // A message node: the hand-off of a send (sendNodeAndGetData, client.go:974-992).
    SentMessage message = 12;
    // A read receipt (MarkRead, receipt.go:197-237).
    ReadReceipt read = 13;
    // The ack for a receipt or a group notification WhatsApp delivered (sendAck, receipt.go:151-181).
    Ack ack = 14;
    // The client asked for a full sync of an app state collection (FetchAppState with fullSync).
    AppStateFullSync app_state_full_sync = 15;
  }
}

// AppStateFullSync is the full sync of one app state collection, asking for its snapshot (appstate.go:466-494).
message AppStateFullSync {
  // The collection's name, as whatsmeow's WAPatchName: "regular_low", "regular_high", ...
  string collection = 1;
}

// Presence is the <presence> SendPresence sends (presence.go:64-87).
message Presence {
  // "available" or "unavailable".
  string type = 1;
  // The account's push name.
  string name = 2;
}

// SubscribePresence is the <presence type="subscribe"> SubscribePresence sends (presence.go:97-125).
message SubscribePresence {
  // The user, in whatsmeow's string form.
  string to = 1;
}

// ChatPresence is the <chatstate> SendChatPresence sends (presence.go:130-144).
message ChatPresence {
  // The chat, in whatsmeow's string form.
  string to = 1;
  // "composing" or "paused".
  string state = 2;
  // "audio" while recording; empty otherwise, and always with paused.
  string media = 3;
}

// DeliverPresenceRequest is one presence stanza.
message DeliverPresenceRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The user whose presence it is.
  string from = 2;
  // True when the user is offline.
  bool unavailable = 3;
  // When the user was last online; unset is none, as for a user whose privacy settings hide it.
  google.protobuf.Timestamp last_seen = 4;
}

// DeliverPresenceResponse has no fields.
message DeliverPresenceResponse {}

// DeliverChatPresenceRequest is one chat state stanza.
message DeliverChatPresenceRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The chat.
  string chat = 2;
  // The user in the chat.
  string sender = 3;
  // The state's tag, as WhatsApp sends it: "composing", "paused", or one whatsmeow does not know.
  string state = 4;
  // "audio" while recording; empty otherwise.
  string media = 5;
}

// DeliverChatPresenceResponse has no fields.
message DeliverChatPresenceResponse {}

