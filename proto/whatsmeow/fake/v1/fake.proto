syntax = "proto3";

package whatsmeow.fake.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// FakeWhatsAppService scripts the fake WhatsApp of a test build of whatsmeow-net (-tags fakewhatsapp) started with
// --fake-whatsapp, and records what the sidecar sent to it. It is served next to whatsmeow.v1 on the same socket,
// with the same token. It is not part of the whatsmeow.v1 contract and never ships (ADR 0019).
//
// Each slice adds the controls it needs here. Errors are INTERNAL with a message: the fake adds no ErrorReason.
service FakeWhatsAppService {
  // DeliverMessage makes WhatsApp deliver a decrypted message to a session's client, and returns once the client's
  // event handlers ran. As whatsmeow does at the pin, the client answers with a receipt only when every handler
  // succeeded (message.go:459-462, 489-495); that shows in WaitForSent. A session without a client is an error: the
  // fake never answers on behalf of a client the sidecar did not create.
  rpc DeliverMessage(DeliverMessageRequest) returns (DeliverMessageResponse);

  // DeliverUndecryptableMessage makes WhatsApp deliver a message the session's client cannot decrypt, and returns once
  // the client's event handlers ran. whatsmeow sends its retry receipt and ack before it dispatches
  // UndecryptableMessage, whatever the handlers return (message.go:418-437); the fake records neither. A resend that
  // decrypts is a DeliverMessage with the same id. A session without a client is an error.
  rpc DeliverUndecryptableMessage(DeliverUndecryptableMessageRequest) returns (DeliverUndecryptableMessageResponse);

  // WaitForSent returns the first thing the session's client sent to WhatsApp after the entry `after`, and waits
  // until there is one. Only the call's deadline or cancellation ends the wait. The log lives in the sidecar process,
  // so it starts again, at index 1, after a restart.
  rpc WaitForSent(WaitForSentRequest) returns (WaitForSentResponse);

  // LinkDevice makes the phone link the session's device: the client stores the device under jid as whatsmeow does
  // after a pair success (handlePair, pair.go:222-240), then dispatches PairSuccess and returns once its event handlers
  // ran. Without a Pair call open it is the quick way to a paired session. With one, the client's QR channel then sends
  // success and closes, as whatsmeow's does (qrchan.go:189-190), and the client logs in again after WhatsApp's 515
  // (connectionevents.go:26-38): off the node queue it uploads its pre-keys, unless FailNextPreKeyUpload, and
  // dispatches Connected (connectionevents.go:187-204).
  rpc LinkDevice(LinkDeviceRequest) returns (LinkDeviceResponse);

  // RotateQrCode makes the session's open QR channel send the next code, as whatsmeow's does when the previous one
  // expires (qrchan.go:92-110). The first code comes when the client connects. No QR channel open is an error.
  rpc RotateQrCode(RotateQrCodeRequest) returns (RotateQrCodeResponse);

  // ExpireQrCodes makes the session's QR codes run out: the QR channel sends timeout and closes, and the client
  // disconnects without a Disconnected event, as whatsmeow's does (qrchan.go:77-84). No QR channel open is an error.
  rpc ExpireQrCodes(ExpireQrCodesRequest) returns (ExpireQrCodesResponse);

  // DropConnection makes the connection of a session that is pairing drop: the client dispatches Disconnected off the
  // node queue (client.go:612-622), and its QR channel then sends timeout and closes (qrchan.go:196-197). whatsmeow
  // does not reconnect an unpaired client (client.go:648). No QR channel open is an error. It returns before the
  // handlers run.
  rpc DropConnection(DropConnectionRequest) returns (DropConnectionResponse);

  // FailNextPreKeyUpload makes the session's next login after a link fail to upload the pre-keys: whatsmeow only logs
  // that (prekeys.go:84-87), never sets PreKeysUploaded, and still dispatches Connected (connectionevents.go:187-204).
  rpc FailNextPreKeyUpload(FailNextPreKeyUploadRequest) returns (FailNextPreKeyUploadResponse);

  // FailNextPairPhone makes WhatsApp answer the session's next phone pairing request with an IQ error of code
  // (pair-code.go:104-127): 429 is whatsmeow's ErrIQRateOverLimit (errors.go:197).
  rpc FailNextPairPhone(FailNextPairPhoneRequest) returns (FailNextPairPhoneResponse);

  // FailNextConnect makes the session's next connect fail with an error whatsmeow does not retry. Without it a
  // connect succeeds, and a linked client then gets Connected, as whatsmeow does once WhatsApp accepts the login.
  rpc FailNextConnect(FailNextConnectRequest) returns (FailNextConnectResponse);

  // FailNextLogout makes the session's next logout get no answer from WhatsApp: whatsmeow's unlink request times out
  // (ErrIQTimedOut, request.go:180-181), and the client stays connected with its device, as whatsmeow's does.
  rpc FailNextLogout(FailNextLogoutRequest) returns (FailNextLogoutResponse);

  // RaisePermanentDisconnect makes WhatsApp end the session's connection with one of the six whatsmeow
  // PermanentDisconnect events at the pin (types/events/events.go:118-128), dispatched off the node queue as
  // whatsmeow does; the client is disconnected and does not reconnect. For logged_out the client also deletes its
  // device concurrently, as whatsmeow does (connectionevents.go:37-44, 130-136). It returns before the handlers run.
  rpc RaisePermanentDisconnect(RaisePermanentDisconnectRequest) returns (RaisePermanentDisconnectResponse);

  // RegisterUser adds a user to WhatsApp's directory, which every session's lookups read: IsOnWhatsApp, GetUserInfo,
  // and the LID that UpdateBlocklist fetches. An unregistered number is not on WhatsApp. Registering a phone_jid again
  // replaces it.
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);

  // SetProfilePicture sets what WhatsApp answers for the profile picture of a user or a group; without one it answers
  // that there is none.
  rpc SetProfilePicture(SetProfilePictureRequest) returns (SetProfilePictureResponse);

  // DeliverContactNotification makes WhatsApp send the session's client a picture or status notification. As
  // whatsmeow does, the client dispatches Picture or UserAbout on the node queue and ignores the handlers' result
  // (notification.go:91-115, 449-466, 472); it returns once the handlers ran. A session without a client is an error.
  rpc DeliverContactNotification(DeliverContactNotificationRequest) returns (DeliverContactNotificationResponse);

  // SyncContact makes an app state sync deliver a contact's saved name: the client stores it, then dispatches Contact,
  // as whatsmeow does (appstate.go:292-296). The session must be linked.
  rpc SyncContact(SyncContactRequest) returns (SyncContactResponse);

  // FailNextContactQuery makes WhatsApp answer the session's next contact query (IsOnWhatsApp, GetUserInfo,
  // GetProfilePictureInfo, GetBlocklist, UpdateBlocklist) with an IQ error of code: 429 is whatsmeow's
  // ErrIQRateOverLimit (errors.go:197).
  rpc FailNextContactQuery(FailNextContactQueryRequest) returns (FailNextContactQueryResponse);
}

// LinkDeviceRequest names the session and the device's JID.
message LinkDeviceRequest {
  // The session whose client is linked.
  string session_id = 1;
  // The device JID WhatsApp assigns, user:device@s.whatsapp.net.
  string jid = 2;
}

// LinkDeviceResponse has no fields.
message LinkDeviceResponse {}

// RotateQrCodeRequest names the session.
message RotateQrCodeRequest {
  // The session whose QR channel sends the next code.
  string session_id = 1;
}

// RotateQrCodeResponse has no fields.
message RotateQrCodeResponse {}

// ExpireQrCodesRequest names the session.
message ExpireQrCodesRequest {
  // The session whose QR codes run out.
  string session_id = 1;
}

// ExpireQrCodesResponse has no fields.
message ExpireQrCodesResponse {}

// DropConnectionRequest names the session.
message DropConnectionRequest {
  // The session whose connection drops.
  string session_id = 1;
}

// DropConnectionResponse has no fields.
message DropConnectionResponse {}

// FailNextPreKeyUploadRequest names the session.
message FailNextPreKeyUploadRequest {
  // The session whose next pre-key upload fails.
  string session_id = 1;
}

// FailNextPreKeyUploadResponse has no fields.
message FailNextPreKeyUploadResponse {}

// FailNextPairPhoneRequest names the session and the error.
message FailNextPairPhoneRequest {
  // The session whose next phone pairing request fails.
  string session_id = 1;
  // WhatsApp's IQ error code.
  int32 code = 2;
}

// FailNextPairPhoneResponse has no fields.
message FailNextPairPhoneResponse {}

// FailNextConnectRequest names the session.
message FailNextConnectRequest {
  // The session whose next connect fails.
  string session_id = 1;
}

// FailNextConnectResponse has no fields.
message FailNextConnectResponse {}

// FailNextLogoutRequest names the session.
message FailNextLogoutRequest {
  // The session whose next logout gets no answer.
  string session_id = 1;
}

// FailNextLogoutResponse has no fields.
message FailNextLogoutResponse {}

// RaisePermanentDisconnectRequest is one PermanentDisconnect event.
message RaisePermanentDisconnectRequest {
  // events.LoggedOut.
  message LoggedOut {
    // The connect failure reason: 401, 403 or 406.
    int32 reason = 1;
  }

  // events.StreamReplaced.
  message StreamReplaced {}

  // events.ClientOutdated.
  message ClientOutdated {}

  // events.CATRefreshError.
  message CatRefreshError {
    // The refresh error's text.
    string message = 1;
  }

  // events.TemporaryBan.
  message TemporaryBan {
    // The ban code.
    int32 code = 1;
    // The time left, whole seconds; zero when WhatsApp sent none.
    google.protobuf.Duration expire = 2;
  }

  // events.ConnectFailure.
  message ConnectFailure {
    // The failure reason.
    int32 reason = 1;
    // The failure message.
    string message = 2;
  }

  // The session whose connection ends.
  string session_id = 1;
  // The event.
  oneof kind {
    // See LoggedOut.
    LoggedOut logged_out = 2;
    // See StreamReplaced.
    StreamReplaced stream_replaced = 3;
    // See ClientOutdated.
    ClientOutdated client_outdated = 4;
    // See CatRefreshError.
    CatRefreshError cat_refresh_error = 5;
    // See TemporaryBan.
    TemporaryBan temporary_ban = 6;
    // See ConnectFailure.
    ConnectFailure connect_failure = 7;
  }
}

// RaisePermanentDisconnectResponse has no fields.
message RaisePermanentDisconnectResponse {}

// DeliverMessageRequest is one inbound message. A JID is whatsmeow's string form; empty is none.
message DeliverMessageRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The WhatsApp message id.
  string id = 2;
  // The chat.
  string chat = 3;
  // The sender.
  string sender = 4;
  // The text, as a conversation message; empty sends an empty message.
  string text = 5;
  // The sender's other address form.
  string sender_alt = 6;
  // In a direct chat, the recipient's other address form.
  string recipient_alt = 7;
  // True when another of the account's devices sent it.
  bool is_from_me = 8;
  // The sender's push name.
  string push_name = 9;
  // The message's WhatsApp timestamp; unset is the zero time.
  google.protobuf.Timestamp message_time = 10;
  // True for a group message as whatsmeow sends one with a new sender key (send.go:795-831): the stanza's pkmsg part
  // decrypts to only the sender key, and its skmsg part to the content. The client dispatches a Message for each, with
  // the same info, in that order (message.go:355-497, 1172-1178), and answers once, after both.
  bool sender_key = 11;
}

// DeliverUndecryptableMessageRequest is one inbound message that fails to decrypt.
message DeliverUndecryptableMessageRequest {
  // The session whose client receives it.
  string session_id = 1;
  // The WhatsApp message id.
  string id = 2;
  // The chat.
  string chat = 3;
  // The sender.
  string sender = 4;
  // True when the sender asked not to show a placeholder (decrypt-fail="hide").
  bool hide_placeholder = 5;
  // The message's WhatsApp timestamp; unset is the zero time.
  google.protobuf.Timestamp message_time = 6;
}

// DeliverUndecryptableMessageResponse has no fields.
message DeliverUndecryptableMessageResponse {}

// DeliverMessageResponse has no fields.
message DeliverMessageResponse {}

// WaitForSentRequest selects the next entry of one session.
message WaitForSentRequest {
  // The session whose entries count.
  string session_id = 1;
  // The index of the last entry already seen; 0 for the first.
  uint64 after = 2;
}

// WaitForSentResponse is the entry.
message WaitForSentResponse {
  // The entry.
  Sent sent = 1;
}

// Sent is one thing a client sent to WhatsApp.
message Sent {
  // Its position in the log, from 1, across all sessions.
  uint64 index = 1;
  // The session whose client sent it.
  string session_id = 2;
  // What was sent.
  oneof kind {
    // The receipt for a message WhatsApp delivered.
    Receipt receipt = 3;
    // The client closed its connection.
    Disconnect disconnect = 4;
    // The client asked WhatsApp to unlink its device (Logout).
    RemoveCompanionDevice remove_companion_device = 5;
  }
}

// Disconnect is the client closing a connection that was open.
message Disconnect {}

// RemoveCompanionDevice is the remove-companion-device request whatsmeow's Logout sends (client.go:749-779).
message RemoveCompanionDevice {}

// Receipt is the <receipt> whatsmeow sends for a decrypted message once its handlers succeeded
// (sendMessageReceipt, receipt.go:280-296).
message Receipt {
  // The message id.
  string id = 1;
  // The receipt type: "inactive" for a message from someone else while the client sends no active receipts.
  string type = 2;
}

// RegisterUserRequest is one WhatsApp user.
message RegisterUserRequest {
  // The user's phone-number JID, digits@s.whatsapp.net.
  string phone_jid = 1;
  // The user's LID, digits@lid; empty for none.
  string lid = 2;
  // The about text.
  string about = 3;
  // The verified business name; empty for none.
  string business_name = 4;
}

// RegisterUserResponse has no fields.
message RegisterUserResponse {}

// SetProfilePictureRequest is one profile picture.
message SetProfilePictureRequest {
  // A picture that is set.
  message Picture {
    // The picture's id.
    string id = 1;
    // The picture's URL.
    string url = 2;
  }

  // The picture is hidden from every session.
  message Hidden {}

  // The user or group.
  string jid = 1;
  // The picture.
  oneof picture {
    // See Picture.
    Picture set = 2;
    // See Hidden.
    Hidden hidden = 3;
  }
}

// SetProfilePictureResponse has no fields.
message SetProfilePictureResponse {}

// DeliverContactNotificationRequest is one notification.
message DeliverContactNotificationRequest {
  // A picture notification (notification.go:91-115).
  message Picture {
    // The user or group whose picture changed.
    string jid = 1;
    // The new picture's id; ignored when removed.
    string id = 2;
    // True when the picture was removed.
    bool removed = 3;
  }

  // A status notification (notification.go:449-466).
  message About {
    // The user whose about text changed.
    string jid = 1;
    // The new about text.
    string text = 2;
  }

  // The session whose client receives it.
  string session_id = 1;
  // The notification.
  oneof kind {
    // See Picture.
    Picture picture = 2;
    // See About.
    About about = 3;
  }
}

// DeliverContactNotificationResponse has no fields.
message DeliverContactNotificationResponse {}

// SyncContactRequest is one contact of an app state sync.
message SyncContactRequest {
  // The session whose client syncs it.
  string session_id = 1;
  // The contact's JID.
  string jid = 2;
  // The saved first name.
  string first_name = 3;
  // The saved full name.
  string full_name = 4;
}

// SyncContactResponse has no fields.
message SyncContactResponse {}

// FailNextContactQueryRequest names the session and the error.
message FailNextContactQueryRequest {
  // The session whose next contact query fails.
  string session_id = 1;
  // WhatsApp's IQ error code.
  int32 code = 2;
}

// FailNextContactQueryResponse has no fields.
message FailNextContactQueryResponse {}
