syntax = "proto3";

package whatsmeow.v1;

import "google/protobuf/timestamp.proto";
import "waE2E/WAWebProtobufsE2E.proto";
import "whatsmeow/v1/chatstate.proto";
import "whatsmeow/v1/contact.proto";
import "whatsmeow/v1/media.proto";
import "whatsmeow/v1/presence.proto";
import "whatsmeow/v1/group.proto";
import "whatsmeow/v1/session.proto";

// EventService delivers each session's events at least once, from the sidecar's durable outbox.
//
// Each recorded event has a seq: greater than 0, unique in the sidecar's database, increasing in recording order,
// never reused. Sessions share the sequence, so one session's seqs have gaps.
// The sidecar keeps a cursor per (session, consumer): the highest seq the consumer acked. A consumer is a name the
// client chooses, with the same rules as a session id. Its cursor starts at 0, and StreamEvents or AckEvents
// creates it; a new consumer gets the events still retained.
// An event is deleted only after every consumer of its session acked it; a session with no consumer keeps every
// event. The session's highest recorded seq is kept even when its rows are deleted.
// A repeated event has the same seq and content while it is retained. One that every consumer acked and that was
// deleted can still be dispatched again by whatsmeow after a crash, and is then recorded again with a new seq;
// handlers dedupe on the session and the WhatsApp message id.
// A client skips, but still acks, a payload case it does not know.
service EventService {
  // StreamEvents sends the session's events with seq above max(after_seq, cursor), in seq order: the backlog,
  // then live events as they are recorded. It never ends with OK.
  // An after_seq above the cursor skips events without acking them, for a client that resumes a dropped stream
  // while it still holds the events in between: after_seq is the highest seq it received in this process, 0 in a
  // new process.
  // A newer StreamEvents for the same session and consumer replaces an open one, which ends with
  // CONSUMER_REPLACED. A client treats that as final and does not reopen.
  // The stream ends with SESSION_NOT_FOUND when the session is deleted.
  // Errors: INVALID_ARGUMENT (also an after_seq above the session's highest recorded seq), SESSION_NOT_FOUND,
  // CONSUMER_REPLACED.
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);

  // AckEvents marks every event of the session at or below up_to_seq as handled by the consumer.
  // At or below the cursor it succeeds and changes nothing: the cursor never moves backwards.
  // Above the session's highest recorded seq it fails with INVALID_ARGUMENT and changes nothing. The bound is the
  // recorded seq, not what this process streamed, so an ack sent across a sidecar restart still succeeds.
  // Errors: INVALID_ARGUMENT, SESSION_NOT_FOUND.
  rpc AckEvents(AckEventsRequest) returns (AckEventsResponse);

  // StreamEphemeralEvents sends the session's ephemeral events, presence and chat presence, as they arrive. They are
  // best effort: never recorded, never acked, without a seq, and gone when the sidecar restarts. Their order is kept
  // among themselves, not relative to StreamEvents.
  // The sidecar keeps each session's newest 256 in memory, also while no stream is open. A stream starts after the
  // newest event any stream of the session got: one opened while none is open so first gets the ones no stream got,
  // and one opened while another is open starts where the furthest open one is. Every open stream gets every event
  // from then on. When events a stream would get were dropped, because more arrived than are kept while the stream
  // fell behind or none was open, the stream gets a QueueOverflowEvent with how many, before the next event.
  // The stream ends with SESSION_NOT_FOUND when the session is deleted.
  // Errors: SESSION_NOT_FOUND.
  rpc StreamEphemeralEvents(StreamEphemeralEventsRequest) returns (stream StreamEphemeralEventsResponse);
}

// MessageSource is who a message or receipt is from and in which chat.
// A JID is whatsmeow's string form, user[.agent][:device]@server; empty means unknown. A user is addressed by
// phone number (@s.whatsapp.net) or LID (@lid), and an alt field holds the other form when WhatsApp sent it.
message MessageSource {
  // The chat: the other user in a direct chat, or the group.
  string chat = 1;
  // The sender.
  string sender = 2;
  // The sender's other address form.
  string sender_alt = 3;
  // In a direct chat, the recipient's other address form.
  string recipient_alt = 4;
  // True when the account itself sent it, from another of its devices.
  bool is_from_me = 5;
}

// MessageInfo identifies a message.
message MessageInfo {
  // Who and where.
  MessageSource source = 1;
  // The WhatsApp message id.
  string id = 2;
  // The sender's push name, when WhatsApp sent it.
  string push_name = 3;
  // The message's WhatsApp timestamp.
  google.protobuf.Timestamp message_time = 4;
}

// MessageEvent is a decrypted message.
message MessageEvent {
  // The message's identity.
  MessageInfo info = 1;
  // The content as whatsmeow unwraps it (device-sent, ephemeral, view-once, edit and similar wrappers removed).
  WAWebProtobufsE2E.Message message = 2;
  // True when whatsmeow unwrapped the content from a view-once wrapper (ViewOnceMessage, V2 or V2Extension).
  bool view_once = 3;
  // True when whatsmeow unwrapped the content from an ephemeral wrapper (EphemeralMessage): a disappearing message.
  bool ephemeral = 4;
  // For a message the account sent from another of its devices to a user, the chat it went to, as that device said in
  // its DeviceSentMessage wrapper; empty for every other message.
  string device_sent_destination = 5;
  // The message as received, wrappers included, when whatsmeow unwrapped any; unset when it unwrapped none, as the
  // message is then what was received.
  WAWebProtobufsE2E.Message raw_message = 6;
  // For a reaction, an edit or a revoke, the message its key names; unset for every other message, and for a key
  // that names none: one without an id, one whose participant is not a JID, or, outside a direct chat, one that is
  // not the actor's and names no participant.
  MessageTarget target = 7;
}

// MessageTarget is the message a reaction, an edit or a revoke names by its key.
message MessageTarget {
  // The message's WhatsApp id.
  string id = 1;
  // Its sender, a user's JID without a device, as mautrix reads a key (pkg/msgconv/wa-poll.go:97-132 at 5dd621f): the
  // actor when the key says the actor sent it, else the key's participant, else, in a direct chat, the other side:
  // the chat when the account acted, else the account. Empty for the account's own message, by its phone number or
  // LID and from any device, so empty always means the account's.
  string sender = 2;
}

// ReceiptEvent is a receipt for one or more messages of a chat.
message ReceiptEvent {
  // Who sent the receipt, and in which chat.
  MessageSource source = 1;
  // The messages it covers.
  repeated string message_ids = 2;
  // The receipt's WhatsApp timestamp.
  google.protobuf.Timestamp receipt_time = 3;
  // The kind of receipt.
  ReceiptType type = 4;
  // The sender of the messages it covers, when WhatsApp said: in a group, for a receipt from another of the account's
  // devices (READ_SELF, PLAYED_SELF), the member whose messages were read; for a receipt from another user, usually
  // the account itself. Empty when WhatsApp did not say.
  string message_sender = 5;
}

// ReceiptType is the kind of a receipt.
enum ReceiptType {
  // A kind this list does not have.
  RECEIPT_TYPE_UNSPECIFIED = 0;
  // Delivered to the recipient.
  RECEIPT_TYPE_DELIVERED = 1;
  // Delivered to another of the account's devices.
  RECEIPT_TYPE_SENDER = 2;
  // The recipient could not decrypt it; whatsmeow resends on its own.
  RECEIPT_TYPE_RETRY = 3;
  // Read by the recipient.
  RECEIPT_TYPE_READ = 4;
  // Read on another of the account's devices, with read receipts turned off.
  RECEIPT_TYPE_READ_SELF = 5;
  // A view-once message was opened.
  RECEIPT_TYPE_PLAYED = 6;
  // A view-once message was opened on another of the account's devices.
  RECEIPT_TYPE_PLAYED_SELF = 7;
  // The server could not deliver it.
  RECEIPT_TYPE_SERVER_ERROR = 8;
  // The recipient's device is inactive.
  RECEIPT_TYPE_INACTIVE = 9;
  // A peer message between the account's own devices.
  RECEIPT_TYPE_PEER_MSG = 10;
  // A history sync blob was received.
  RECEIPT_TYPE_HISTORY_SYNC = 11;
}

// UndecryptableMessageEvent is a message that failed to decrypt. whatsmeow usually asks for a resend, and a resend
// that decrypts arrives later as a MessageEvent.
message UndecryptableMessageEvent {
  // The message's identity.
  MessageInfo info = 1;
  // True when the sender asked not to show a "waiting for this message" placeholder.
  bool hide_placeholder = 2;
  // True when the sender's device sent this device no ciphertext at all. whatsmeow then asks the account's phone for
  // it, and acknowledges the message whatever the handler does (message.go:324-333), so it is best effort.
  bool unavailable = 3;
  // Why it is unavailable, when WhatsApp said; unspecified when it did not, or for a message that is not unavailable.
  UnavailableType unavailable_type = 4;
}

// UnavailableType is why WhatsApp sent this device no ciphertext for a message.
enum UnavailableType {
  // No type, or a type this list does not have.
  UNAVAILABLE_TYPE_UNSPECIFIED = 0;
  // A view-once message. whatsmeow asks the phone for it (message.go:327-330) and dispatches an answer as a normal
  // message (message.go:870-877); whether the phone answers for a view-once is unknown, #36 checks it live.
  UNAVAILABLE_TYPE_VIEW_ONCE = 1;
}

// ConnectionStateEvent is a session state transition, in order with the session's other events.
message ConnectionStateEvent {
  // The new state.
  SessionState state = 1;
}

// StreamEventsRequest opens a session's event stream for a consumer.
message StreamEventsRequest {
  // The session id.
  string session_id = 1;
  // The consumer name.
  string consumer = 2;
  // Skip events at or below this seq; 0 resumes from the cursor.
  uint64 after_seq = 3;
}

// StreamEventsResponse is one event.
// Payload cases are numbered from 10, in the order they are added; 1 to 9 are for the fields every event has.
message StreamEventsResponse {
  // The sequence number.
  uint64 seq = 1;

  // The event.
  oneof payload {
    // A message received, or sent from another of the account's devices.
    MessageEvent message = 10;
    // A receipt.
    ReceiptEvent receipt = 11;
    // A message that could not be decrypted.
    UndecryptableMessageEvent undecryptable_message = 12;
    // A session state transition.
    ConnectionStateEvent connection_state = 13;
    // A change to a contact's profile; best effort (contact.proto).
    ContactEvent contact = 14;
    // The phone's answer to a media retry request (media.proto).
    MediaRetryEvent media_retry = 15;
    // A group notification: a change to a group, or the session joining one (group.proto).
    GroupEvent group = 16;
    // A change to a chat's state; best effort (chatstate.proto).
    ChatStateEvent chat_state = 17;
    // A batch of the account's history, from a history sync blob; see history.proto.
    HistoryMessagesEvent history_messages = 18;
    // A history sync blob processed, or given up on; see history.proto.
    HistorySyncProgressEvent history_progress = 19;
  }
}

// HistorySyncType is which history a history sync blob carries, as WhatsApp names it.
enum HistorySyncType {
  // A type this list does not have.
  HISTORY_SYNC_TYPE_UNSPECIFIED = 0;
  // The first, recent history after pairing.
  HISTORY_SYNC_TYPE_INITIAL_BOOTSTRAP = 1;
  // Status updates after pairing.
  HISTORY_SYNC_TYPE_INITIAL_STATUS_V3 = 2;
  // Older history, as much as the history options ask for.
  HISTORY_SYNC_TYPE_FULL = 3;
  // Recent history.
  HISTORY_SYNC_TYPE_RECENT = 4;
  // Contacts' push names; no messages.
  HISTORY_SYNC_TYPE_PUSH_NAME = 5;
  // Other account data; no messages.
  HISTORY_SYNC_TYPE_NON_BLOCKING_DATA = 6;
  // The answer to a RequestHistory.
  HISTORY_SYNC_TYPE_ON_DEMAND = 7;
  // The phone says it sends no history; no messages. When it sends this is WhatsApp's, and not documented.
  HISTORY_SYNC_TYPE_NO_HISTORY = 8;
  // The phone says how much of the account's messages this device may read; no messages.
  HISTORY_SYNC_TYPE_MESSAGE_ACCESS_STATUS = 9;
}

// HistoryMessagesEvent is a batch of history messages: old messages, never live ones. A blob's messages arrive in one
// or more batches, in the blob's order, each small enough for one gRPC message, then the blob's
// HistorySyncProgressEvent. A batch delivered again carries the same messages. Status updates (statuses) a blob carries
// are never delivered; they count in the progress event's skipped_count.
message HistoryMessagesEvent {
  // Which history the blob carries.
  HistorySyncType sync_type = 1;
  // The messages, as live messages are: each with its chat, sender, id and content.
  repeated MessageEvent messages = 2;
}

// HistorySyncFailure is why a history sync blob was given up on.
enum HistorySyncFailure {
  // None: the blob's messages were delivered.
  HISTORY_SYNC_FAILURE_UNSPECIFIED = 0;
  // WhatsApp's media server no longer has it (403, 404 or 410).
  HISTORY_SYNC_FAILURE_EXPIRED = 1;
  // It could not be read: it failed its checks, or did not decompress or parse.
  HISTORY_SYNC_FAILURE_INVALID = 2;
  // Its download kept failing, three times a minute apart, while the session was online.
  HISTORY_SYNC_FAILURE_UNAVAILABLE = 3;
}

// HistorySyncProgressEvent is one history sync blob done: after its messages were delivered, or when it was given up
// on. The sidecar deletes a blob from WhatsApp's server only once this event and its batches are recorded.
message HistorySyncProgressEvent {
  // Which history the blob carries.
  HistorySyncType sync_type = 1;
  // The blob's place among the sync's blobs, as WhatsApp numbers them.
  uint32 chunk_order = 2;
  // WhatsApp's progress value for the sync, as it sent it.
  uint32 progress = 3;
  // How many of its messages the sidecar delivered in its batches.
  uint32 message_count = 4;
  // How many of its messages the sidecar did not deliver: one that does not parse, one too large for a gRPC message,
  // and every status update.
  uint32 skipped_count = 5;
  // Why it was given up on; unspecified when its messages were delivered.
  HistorySyncFailure failure = 6;
}

// AckEventsRequest moves a consumer's cursor.
message AckEventsRequest {
  // The session id.
  string session_id = 1;
  // The consumer name.
  string consumer = 2;
  // Every event of the session at or below this seq is handled.
  uint64 up_to_seq = 3;
}

// AckEventsResponse has no fields.
message AckEventsResponse {}

// PresenceEvent is a user's presence, sent after a SubscribePresence.
message PresenceEvent {
  // The user, a JID in whatsmeow's string form.
  string from = 1;
  // Online or offline; never unspecified.
  PresenceState state = 2;
  // When the user was last online; unset when WhatsApp sent none, as for a user whose privacy settings hide it.
  google.protobuf.Timestamp last_seen = 3;
}

// ChatPresenceEvent is what a user is doing in a chat: typing, recording, or neither any more.
message ChatPresenceEvent {
  // Who and where.
  MessageSource source = 1;
  // The state; unspecified for one this list does not have.
  ChatPresenceState state = 2;
}

// QueueOverflowEvent is how many ephemeral events a stream did not get.
message QueueOverflowEvent {
  // How many were dropped since the last event of the stream.
  uint64 dropped = 1;
}

// StreamEphemeralEventsRequest opens a session's ephemeral event stream.
message StreamEphemeralEventsRequest {
  // The session id.
  string session_id = 1;
}

// StreamEphemeralEventsResponse is one ephemeral event. It has no seq.
// Payload cases are numbered from 10, in the order they are added.
message StreamEphemeralEventsResponse {
  // The event.
  oneof payload {
    // A user's presence.
    PresenceEvent presence = 10;
    // A user's state in a chat.
    ChatPresenceEvent chat_presence = 11;
    // Events this stream did not get.
    QueueOverflowEvent queue_overflow = 12;
  }
}
