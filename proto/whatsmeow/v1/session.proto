syntax = "proto3";

package whatsmeow.v1;

import "google/protobuf/timestamp.proto";

// SessionService manages sessions (one WhatsApp account each), their connection and their pairing.
//
// A session id is chosen by the application: 1 to 64 characters of [A-Za-z0-9._-], starting with a letter or a
// digit, case-sensitive. Any other id is INVALID_ARGUMENT (field "session_id").
// Every RPC that names a session, except CreateSession, fails with SESSION_NOT_FOUND for an id no session has.
service SessionService {
  // CreateSession creates an unpaired session (state Created), or returns the existing one with that id.
  // Errors: INVALID_ARGUMENT.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ListSessions returns every session, ordered by id.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // DeleteSession disconnects the session if it is connected, then deletes its local data: device keys, outbox
  // events, consumer cursors and send records. Open streams on it end with SESSION_NOT_FOUND.
  // It does not tell WhatsApp, so a paired device stays linked on the phone; to unlink it, call Logout first.
  // Errors: SESSION_NOT_FOUND.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);

  // Connect connects a paired session. The session is Connecting while whatsmeow's connect call runs, and Connect
  // returns once the WhatsApp connection is open (the session stays Connecting until WhatsApp accepts the login,
  // then becomes Connected) or whatsmeow is retrying (Reconnecting). A login WhatsApp refuses (a logout, a ban,
  // an outdated client) arrives later as the session's state. After CONNECTION_FAILED the session is back in its
  // previous state.
  // Connecting a session that is connecting, connected or reconnecting succeeds and does nothing. From Outdated,
  // Replaced or Error, and from TempBanned once the ban has ended or has no known end, it is a new attempt. While a
  // ban with a known end lasts, it fails with TEMPORARILY_BANNED. LOGGED_OUT and NOT_LOGGED_IN are the session's
  // state, not WhatsApp's answer.
  // The sidecar never connects a session on its own, also not after a restart.
  // Errors: SESSION_NOT_FOUND, NOT_LOGGED_IN, LOGGED_OUT, PAIRING_IN_PROGRESS, TEMPORARILY_BANNED, CONNECTION_FAILED.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  // Disconnect closes the connection and stops reconnecting; the session stays paired (state Disconnected).
  // Disconnecting a session that is not connected succeeds and does nothing. While a Pair call is open and the phone
  // has not linked the device, it fails with PAIRING_IN_PROGRESS (cancel the Pair call instead); after the link it
  // stops the login, and the Pair call fails with PAIRING_FAILED.
  // Errors: SESSION_NOT_FOUND, PAIRING_IN_PROGRESS.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

  // Logout unlinks the device on WhatsApp, then deletes its keys; the session stays, in state LoggedOut, and can be
  // paired again. WhatsApp is told first, so the session must be connected.
  // Errors: SESSION_NOT_FOUND, NOT_LOGGED_IN, LOGGED_OUT, NOT_CONNECTED, OUTCOME_UNKNOWN, WHATSAPP_ERROR.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Pair links a session in state Created or LoggedOut to an account. It connects, then streams QR codes, or one
  // phone pairing code when phone is set, until the phone links the device. The last item is success, sent once
  // whatsmeow reports Connected after the link and the device's pre-keys are uploaded; the stream then ends with OK
  // and the session is Connected. If that fails after the link (the pre-keys were not uploaded, or no login within
  // 60 seconds), the stream ends with PAIRING_FAILED and the session is Disconnected (paired; Connect retries); if
  // WhatsApp ends the login with a stopping state (LoggedOut, TempBanned, ...), the session is in that state.
  // The QR codes, and the phone code with them, run out after about 160 seconds: PAIRING_TIMED_OUT.
  // Before the link, the client ends pairing by cancelling the call: the sidecar disconnects, and the session returns
  // to the state it had before Pair. After the link, a cancel never disconnects; Disconnect does.
  // Pairing a paired session fails with ALREADY_PAIRED, and a second Pair while one is open fails with
  // PAIRING_IN_PROGRESS: it never starts a second pairing.
  // Errors: INVALID_ARGUMENT (also a phone number that is too short or not international, field
  // "phone.phone_number"), SESSION_NOT_FOUND, ALREADY_PAIRED, PAIRING_IN_PROGRESS, PAIRING_TIMED_OUT,
  // PAIRING_FAILED, CONNECTION_FAILED, RATE_LIMITED, WHATSAPP_ERROR.
  rpc Pair(PairRequest) returns (stream PairResponse);

  // WatchSessionState sends the current state first, then changes, until the client cancels. A reader that falls
  // behind gets the latest state and can miss intermediate ones; every transition is in StreamEvents
  // (ConnectionStateEvent). The stream ends with SESSION_NOT_FOUND when the session is deleted.
  // Errors: SESSION_NOT_FOUND.
  rpc WatchSessionState(WatchSessionStateRequest) returns (stream WatchSessionStateResponse);
}

// Session is one WhatsApp account.
message Session {
  // The application-chosen id.
  string id = 1;
  // The current state.
  SessionState state = 2;
  // The device's phone-number JID; empty while not paired.
  string jid = 3;
  // The device's LID JID; empty while not paired or unknown.
  string lid = 4;
}

// SessionState is the session state machine (ARCHITECTURE §7.4); exactly one case is set.
// A client treats a kind it does not know as unknown.
message SessionState {
  // Never paired.
  message Created {}

  // A Pair call is open.
  message Pairing {}

  // Connect was called; the connection is opening.
  message Connecting {}

  // Logged in to WhatsApp; the offline backlog may still be arriving.
  message Connected {}

  // Connected, and the backlog queued while offline has arrived.
  message CaughtUp {}

  // The connection dropped, or the sidecar reset it so that WhatsApp delivers again a message whose answer was
  // withheld; whatsmeow is reconnecting.
  message Reconnecting {}

  // Paired, not connected: Disconnect was called, the sidecar restarted, or pairing failed after the link.
  // A restart keeps the states that stop a session: a never-paired session is Created, and LoggedOut, Replaced,
  // Outdated, TempBanned and Error come back as they were, with their fields. A session that was Connecting,
  // Connected, CaughtUp, Reconnecting or Disconnected comes back Disconnected.
  message Disconnected {}

  // The device was unlinked and its keys deleted.
  message LoggedOut {
    // WhatsApp's logout code (401, 403 or 406 at the pin); 0 when the client called Logout.
    int32 code = 1;
  }

  // Another client connected with the same keys, and WhatsApp closed this connection.
  message Replaced {}

  // The account is temporarily banned.
  message TempBanned {
    // WhatsApp's ban code.
    int32 code = 1;
    // When the ban ends: the sidecar's receive time plus the remaining time WhatsApp sent; unset when it sent none.
    google.protobuf.Timestamp expire_time = 2;
  }

  // WhatsApp rejected this client version.
  message Outdated {}

  // The connection ended for another reason, and whatsmeow does not reconnect on its own. The session stays paired;
  // Connect retries. LoggedOut is the only state that needs a new Pair.
  message Error {
    // WhatsApp's failure code, or 0 when there is none.
    int32 code = 1;
    // A description for logs; never match on it.
    string message = 2;
  }

  // The state.
  oneof kind {
    // See Created.
    Created created = 1;
    // See Pairing.
    Pairing pairing = 2;
    // See Connecting.
    Connecting connecting = 3;
    // See Connected.
    Connected connected = 4;
    // See CaughtUp.
    CaughtUp caught_up = 5;
    // See Reconnecting.
    Reconnecting reconnecting = 6;
    // See Disconnected.
    Disconnected disconnected = 7;
    // See LoggedOut.
    LoggedOut logged_out = 8;
    // See Replaced.
    Replaced replaced = 9;
    // See TempBanned.
    TempBanned temp_banned = 10;
    // See Outdated.
    Outdated outdated = 11;
    // See Error.
    Error error = 12;
  }
}

// CreateSessionRequest names the session.
message CreateSessionRequest {
  // The session id.
  string session_id = 1;
}

// CreateSessionResponse is the created or existing session.
message CreateSessionResponse {
  // The session.
  Session session = 1;
}

// ListSessionsRequest has no fields.
message ListSessionsRequest {}

// ListSessionsResponse is every session.
message ListSessionsResponse {
  // The sessions, ordered by id.
  repeated Session sessions = 1;
}

// DeleteSessionRequest names the session.
message DeleteSessionRequest {
  // The session id.
  string session_id = 1;
}

// DeleteSessionResponse has no fields.
message DeleteSessionResponse {}

// ConnectRequest names the session.
message ConnectRequest {
  // The session id.
  string session_id = 1;
}

// ConnectResponse has no fields.
message ConnectResponse {}

// DisconnectRequest names the session.
message DisconnectRequest {
  // The session id.
  string session_id = 1;
}

// DisconnectResponse has no fields.
message DisconnectResponse {}

// LogoutRequest names the session.
message LogoutRequest {
  // The session id.
  string session_id = 1;
}

// LogoutResponse has no fields.
message LogoutResponse {}

// PairRequest starts pairing.
message PairRequest {
  // Pair by phone number: the phone gets a notification prompting for a code, which this stream sends.
  message Phone {
    // The account's phone number, international format; non-digits are ignored.
    string phone_number = 1;
  }

  // The session id.
  string session_id = 1;
  // Unset: pair with QR codes. Set: pair with a phone code; no QR codes are sent.
  Phone phone = 2;
}

// PairResponse is one pairing step.
message PairResponse {
  // A QR code to show; it replaces the previous one.
  message QrCode {
    // The payload to render as a QR code.
    string code = 1;
  }

  // The code to enter on the phone; sent once.
  message PairingCode {
    // The code, formatted for display.
    string code = 1;
  }

  // The device is linked and ready; the last item.
  message Success {
    // The device's phone-number JID.
    string jid = 1;
    // The device's LID JID; empty when WhatsApp sent none.
    string lid = 2;
  }

  // The step.
  oneof step {
    // See QrCode.
    QrCode qr_code = 1;
    // See PairingCode.
    PairingCode pairing_code = 2;
    // See Success.
    Success success = 3;
  }
}

// WatchSessionStateRequest names the session.
message WatchSessionStateRequest {
  // The session id.
  string session_id = 1;
}

// WatchSessionStateResponse is the current state.
message WatchSessionStateResponse {
  // The state.
  SessionState state = 1;
}
