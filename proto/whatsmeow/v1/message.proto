syntax = "proto3";

package whatsmeow.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "waE2E/WAWebProtobufsE2E.proto";
import "whatsmeow/v1/media.proto";

// MessageService sends messages and read receipts.
//
// A send is idempotent per (session, client_message_id), the WhatsApp message id the client chooses, "3EB0" and 18
// uppercase hex digits (the format whatsmeow makes; any other is INVALID_ARGUMENT):
// after a success, a repeat returns the recorded result and sends nothing; after an unknown outcome, a repeat
// fails with OUTCOME_UNKNOWN again and sends nothing (ARCHITECTURE invariant 10); after a failure that sent
// nothing, a repeat sends; a repeat while the first call is in flight waits for its outcome. A repeat's other
// fields are ignored. So repeating an id is always safe: it never sends a message twice.
// WHATSAPP_ERROR, with WhatsApp's code in the "code" metadata, comes two ways, and a repeat differs:
// WhatsApp refused a query the send makes before the message (the recipient's LID, its devices, a group's members),
// so nothing was sent and a repeat sends; or WhatsApp answered the message itself with an error, which is recorded,
// and a repeat fails with the same WHATSAPP_ERROR and sends nothing. Whether WhatsApp kept a message it answered
// with an error is unknown, so sending it again takes a new client_message_id.
// The sidecar records a send before handing it to whatsmeow, so a send interrupted after the hand-off, by a crash
// or by the client cancelling, reads as OUTCOME_UNKNOWN; one cancelled while still queued sent nothing.
// A send never waits for a connection: a session that is not logged in, not connected or temporarily banned fails
// at once. Sends are paced per session while connected; a WhatsApp 429 is tried again after 1, 2 and 4 s while the
// wait and one second more for the try fit the call's deadline, then fails with RATE_LIMITED; nothing was sent. A
// queued send fails, having sent nothing, when the session stops being Connected or CaughtUp: NOT_CONNECTED,
// LOGGED_OUT or TEMPORARILY_BANNED, as the session's new state says, or SESSION_NOT_FOUND once it is deleted.
service MessageService {
  // SendMessage sends a caller-built message unchanged. A message with an unset proto2 required field is
  // INVALID_ARGUMENT (field "message").
  // Errors: INVALID_ARGUMENT, SESSION_NOT_FOUND, NOT_LOGGED_IN, LOGGED_OUT, NOT_CONNECTED, TEMPORARILY_BANNED,
  // RECIPIENT_NOT_ON_WHATSAPP, RATE_LIMITED, OUTCOME_UNKNOWN, WHATSAPP_ERROR.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // SendText sends a text message.
  // Errors: as SendMessage, and INVALID_ARGUMENT for empty text.
  rpc SendText(SendTextRequest) returns (SendTextResponse);

  // SendMedia sends an image, video, audio file or voice note, document or sticker message of an uploaded or received
  // MediaRef, so re-sending a MediaRef uploads nothing. The metadata is sent as given: the sidecar never decodes the
  // media to check it, and an empty or unset field is not sent. A video or audio MediaRef's streaming sidecar goes into
  // the message; a document with a caption is sent wrapped in a DocumentWithCaptionMessage, which is how WhatsApp
  // shows both.
  // Errors: as SendMessage, and INVALID_ARGUMENT for no or an incomplete media (field "media": a direct path that does
  // not start with "/", a media key or a hash that is not 32 bytes), a media type the kind does not take (field
  // "media.media_type": IMAGE for an image or a sticker, VIDEO, AUDIO, DOCUMENT for the others), no metadata (field
  // "metadata"), or a duration that is negative or over 2^32-1 seconds (field "<kind>.duration").
  rpc SendMedia(SendMediaRequest) returns (SendMediaResponse);

  // MarkRead sends a read receipt, timestamped now, for messages of one chat.
  // Errors: INVALID_ARGUMENT (no message ids; a group chat without sender), SESSION_NOT_FOUND, NOT_LOGGED_IN,
  // LOGGED_OUT, NOT_CONNECTED, TEMPORARILY_BANNED.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
}

// SendMessageRequest sends a caller-built message.
message SendMessageRequest {
  // The session id.
  string session_id = 1;
  // The recipient: a user JID without a device, or a group JID.
  string chat = 2;
  // The WhatsApp message id to send with; required.
  string client_message_id = 3;
  // The message.
  WAWebProtobufsE2E.Message message = 4;
}

// SendMessageResponse is a successful send.
message SendMessageResponse {
  // The chat it was sent to, which can be the recipient's LID when a phone-number JID was requested.
  string chat = 1;
  // The message's WhatsApp timestamp.
  google.protobuf.Timestamp message_time = 2;
}

// SendTextRequest sends a text message.
message SendTextRequest {
  // The session id.
  string session_id = 1;
  // The recipient: a user JID without a device, or a group JID.
  string chat = 2;
  // The WhatsApp message id to send with; required.
  string client_message_id = 3;
  // The text; not empty.
  string text = 4;
}

// SendTextResponse is a successful send.
message SendTextResponse {
  // The chat it was sent to, which can be the recipient's LID when a phone-number JID was requested.
  string chat = 1;
  // The message's WhatsApp timestamp.
  google.protobuf.Timestamp message_time = 2;
}

// SendMediaRequest sends a media message.
message SendMediaRequest {
  // The session id.
  string session_id = 1;
  // The recipient: a user JID without a device, or a group JID.
  string chat = 2;
  // The WhatsApp message id to send with; required.
  string client_message_id = 3;
  // The file on WhatsApp's servers.
  MediaRef media = 4;

  // The kind of message, and what it says about the file.
  oneof metadata {
    // An image.
    ImageMetadata image = 5;
    // A video.
    VideoMetadata video = 6;
    // An audio file or a voice note.
    AudioMetadata audio = 7;
    // A document.
    DocumentMetadata document = 8;
    // A sticker.
    StickerMetadata sticker = 9;
  }
}

// SendMediaResponse is a successful send.
message SendMediaResponse {
  // The chat it was sent to, which can be the recipient's LID when a phone-number JID was requested.
  string chat = 1;
  // The message's WhatsApp timestamp.
  google.protobuf.Timestamp message_time = 2;
}

// ImageMetadata is what an image message says about its file. Empty is not sent.
message ImageMetadata {
  // The file's MIME type.
  string mimetype = 1;
  // The caption.
  string caption = 2;
  // The width in pixels.
  optional uint32 width = 3;
  // The height in pixels.
  optional uint32 height = 4;
  // A JPEG thumbnail.
  bytes jpeg_thumbnail = 5;
}

// VideoMetadata is what a video message says about its file. Empty or unset is not sent.
message VideoMetadata {
  // The file's MIME type.
  string mimetype = 1;
  // The caption.
  string caption = 2;
  // The width in pixels.
  optional uint32 width = 3;
  // The height in pixels.
  optional uint32 height = 4;
  // The length, sent in whole seconds: the fraction is dropped.
  google.protobuf.Duration duration = 5;
  // A JPEG thumbnail.
  bytes jpeg_thumbnail = 6;
}

// AudioMetadata is what an audio message says about its file. Empty or unset is not sent.
message AudioMetadata {
  // The file's MIME type. Phones play a voice note as audio/ogg; codecs=opus; the sidecar does not check it.
  string mimetype = 1;
  // The length, sent in whole seconds: the fraction is dropped.
  google.protobuf.Duration duration = 2;
  // True for a voice note (PTT), false for an audio file; always sent.
  bool voice_note = 3;
  // A voice note's waveform, sent unchanged.
  bytes waveform = 4;
}

// DocumentMetadata is what a document message says about its file. Empty is not sent.
message DocumentMetadata {
  // The file's MIME type.
  string mimetype = 1;
  // The file name the recipient sees.
  string file_name = 2;
  // The caption.
  string caption = 3;
  // A JPEG thumbnail.
  bytes jpeg_thumbnail = 4;
}

// StickerMetadata is what a sticker message says about its file. Empty or unset is not sent.
message StickerMetadata {
  // The file's MIME type.
  string mimetype = 1;
  // The width in pixels.
  optional uint32 width = 2;
  // The height in pixels.
  optional uint32 height = 3;
  // A PNG thumbnail: stickers carry a PNG one, never a JPEG one.
  bytes png_thumbnail = 4;
}

// MarkReadRequest marks messages of one chat as read.
message MarkReadRequest {
  // The session id.
  string session_id = 1;
  // The chat, as in MessageSource.chat.
  string chat = 2;
  // In a group chat, the messages' sender; empty in a direct chat.
  string sender = 3;
  // The messages; at least one.
  repeated string message_ids = 4;
}

// MarkReadResponse has no fields.
message MarkReadResponse {}
