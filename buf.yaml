# buf v2 workspace. Version pinned in /mise.toml.
# Upstream whatsmeow protos are imported unmodified, so lint and breaking skip them (ARCHITECTURE §6).
version: v2
modules:
  - path: proto
  - path: third_party/whatsmeow
lint:
  use:
    - STANDARD
  ignore:
    - third_party/whatsmeow
breaking:
  use:
    - FILE
  ignore:
    - third_party/whatsmeow
    # The fake WhatsApp control is test-only and never ships, so it may change freely; lint still applies (ADR 0019).
    - proto/whatsmeow/fake
    # The live tests' control is test-only and never ships either (ADR 0060).
    - proto/whatsmeow/livetest
